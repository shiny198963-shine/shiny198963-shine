<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shiny</title>
<style>
*{box-sizing:border-box}
body{font-family:sans-serif;line-height:1.8;margin:0;color:#2b2b2b;background:#faf8f5}
.band{background:#1e3a52;color:#fff}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
.band .wrap{padding-top:44px;padding-bottom:40px}
.brand{letter-spacing:.35em;font-size:13px;color:#d8c49a;margin:0 0 6px}
.company{font-size:15px;margin:0 0 18px;color:#e8e2d5}
h1{font-size:32px;margin:0 0 10px;line-height:1.4}
.lead{font-size:17px;margin:0;color:#f0ead9}
.rule{height:3px;background:#b08d57;max-width:760px;margin:0 auto}
main .wrap{padding-top:36px;padding-bottom:8px}
h2{font-size:20px;margin:36px 0 16px;padding-left:12px;border-left:5px solid #b08d57;color:#1e3a52}
h2:first-child{margin-top:0}
.cards{display:flex;gap:14px;flex-wrap:wrap}
.card{flex:1 1 200px;background:#fff;border:1px solid #e5ded0;border-top:4px solid #b08d57;border-radius:6px;padding:18px 16px;font-size:16px;font-weight:bold;color:#1e3a52;box-shadow:0 1px 3px rgba(30,58,82,.06)}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e5ded0;border-radius:6px}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid #eee6d6;vertical-align:top;font-size:15px}
th{width:110px;color:#1e3a52;background:#f6f1e7;font-weight:bold;white-space:nowrap}
tr:last-child th,tr:last-child td{border-bottom:none}
.contact{background:#f6f1e7;border:1px solid #e5ded0;border-radius:6px;padding:16px 20px}
.contact p{margin:4px 0}
footer{background:#1e3a52;color:#cfd8e0;margin-top:44px}
footer .wrap{padding-top:18px;padding-bottom:18px;font-size:14px}
footer p{margin:0}
</style>
</head>
<body>
<header class="band">
<div class="wrap">
<p class="brand">SHINY</p>
<p class="company">株式会社シャイニー</p>
<h1>オリジナルプレートを作成</h1>
<p class="lead">下町で30年メイドインジャパンをお届け</p>
</div>
</header>
<div class="rule"></div>
<main>
<div class="wrap">
<h2>事業内容</h2>
<div class="cards">
<div class="card">銘板　看板<br>ネームプレート</div>
<div class="card">金属雑貨<br>革キーホルダー</div>
<div class="card">販促品　記念品<br>企画製造</div>
</div>
<h2>会社概要</h2>
<table>
<tr><th>会社名</th><td>株式会社シャイニー</td></tr>
<tr><th>事業内容</th><td>オリジナル製品　企画製造販売</td></tr>
<tr><th>所在地</th><td>[住所、または「お問い合わせください」]</td></tr>
</table>
<h2>お問い合わせ</h2>
<div class="contact">
<p>電話：[電話番号]</p>
<p>メール：[メールアドレス]</p>
</div>
</div>
</main>
<footer>
<div class="wrap">
<p>© 株式会社シャイニー</p>
</div>
</footer>
</body>
</html>
